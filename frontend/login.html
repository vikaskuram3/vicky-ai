<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | VICKY AI - ONE PROMPT. ONE STORY. ONE COMPLETE MOVIE.</title>
  <meta name="description" content="Sign in to VICKY AI Video Studio. Experience the next generation of AI video generation, One-Prompt Movie Maker, Character Memory, and Telugu AI Studio.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Supabase JS CDN (Official SDK v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --glow-purple: rgba(168, 85, 247, 0.4);
      --glow-cyan: rgba(6, 182, 212, 0.4);
      --electric-blue: #00f0ff;
      --purple-accent: #8b5cf6;
    }

    body.auth-page {
      background: #030308;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }

    /* Cinematic Animated Background */
    #cinematicCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow-1 {
      position: fixed;
      top: 15%;
      left: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(3, 3, 8, 0) 70%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: 10%;
      right: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(3, 3, 8, 0) 70%);
      filter: blur(70px);
      z-index: 1;
      pointer-events: none;
      animation: floatGlow 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.15); }
    }

    /* Glassmorphism Card */
    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: rgba(11, 14, 27, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 35px -5px rgba(139, 92, 246, 0.25);
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 70%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-tagline {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .auth-subtitle {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-top: 6px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .auth-input {
      width: 100%;
      height: 46px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 0 42px 0 42px;
      color: #f8fafc;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.25s ease;
      outline: none;
    }

    .auth-input:focus {
      border-color: #8b5cf6;
      background: rgba(22, 30, 52, 0.9);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25),
                  0 0 15px rgba(6, 182, 212, 0.2);
    }

    .btn-password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .btn-password-toggle:hover {
      color: #c084fc;
    }

    /* Remember & Forgot */
    .form-row-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 0.82rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #8b5cf6;
      cursor: pointer;
    }

    .link-forgot {
      color: #a855f7;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .link-forgot:hover {
      color: #00f0ff;
      text-decoration: underline;
    }

    /* Buttons */
    .btn-signin {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6), 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .btn-signin:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0;
      color: #64748b;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .divider span {
      padding: 0 12px;
    }

    .btn-google {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #f1f5f9;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .btn-google:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-1px);
    }

    .signup-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .signup-footer a {
      color: #c084fc;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .signup-footer a:hover {
      color: #00f0ff;
      text-decoration: underline;
    }

    .alert-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .alert-banner.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-banner.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #86efac;
    }

    /* Modal for Forgot Password */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #0f1322;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      position: relative;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Cinematic Background Particle Field -->
  <canvas id="cinematicCanvas"></canvas>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Sign In Card -->
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo-badge">
        <!-- VICKY AI Camera Prism SVG -->
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 10L20.5 6.5V17.5L15 14" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="2" y="6" width="13" height="12" rx="3" stroke="#a855f7" stroke-width="2"/>
          <circle cx="8.5" cy="12" r="2.5" fill="#a855f7"/>
        </svg>
      </div>
      <h1 class="brand-title">VICKY AI</h1>
      <div class="brand-tagline">ONE PROMPT. ONE STORY. ONE COMPLETE MOVIE.</div>
      <p class="auth-subtitle">Sign in to your creative video studio</p>
    </div>

    <!-- Alert Message -->
    <div id="authAlert" class="alert-banner"></div>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <!-- Email Input -->
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="loginEmail" class="auth-input" placeholder="creator@vickyai.com" required autocomplete="email">
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn-password-toggle" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Show/Hide Password" aria-label="Toggle password visibility">
            <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-row-remember">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#forgot" class="link-forgot" onclick="openForgotModal(event)">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" id="btnSignIn" class="btn-signin">
        <span id="btnSignInText">Sign In to Studio</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <!-- Divider -->
      <div class="divider">
        <span>or continue with</span>
      </div>

      <!-- Continue with Google -->
      <button type="button" class="btn-google" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1c0 2.8.7 5.4 1.9 7.8l3.7-3.1z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.6C3.7 20.4 7.5 23 12 23z"/></svg>
        <span>Continue with Google</span>
      </button>

      <!-- Create Account Link -->
      <div class="signup-footer">
        Don't have an account? <a href="/signup">Create account</a>
      </div>
    </form>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="modal-backdrop">
    <div class="modal-box">
      <h3 style="color:#ffffff; font-size:1.15rem; margin-bottom:8px; font-family:'Space Grotesk',sans-serif;">Reset Password</h3>
      <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:18px;">Enter your registered email address and we'll dispatch password recovery instructions.</p>
      <div id="forgotAlert" class="alert-banner"></div>
      <div class="form-group">
        <label class="form-label" for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" class="auth-input" placeholder="creator@vickyai.com" style="padding-left:14px;">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" class="btn-signin" style="flex:1;" onclick="submitForgotPassword()">Dispatch Link</button>
        <button type="button" class="btn-google" style="flex:1;" onclick="closeForgotModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Supabase Auth Logic & Animated Canvas -->
  <script src="/js/supabase_auth.js"></script>
  <script>
    // 1. Password Visibility Toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('loginPassword');
      const eyeOpen = document.getElementById('eyeIconOpen');
      const eyeClosed = document.getElementById('eyeIconClosed');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        pwdInput.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    // 2. Alert Banner Helper
    function showAlert(msg, isError = true) {
      const alert = document.getElementById('authAlert');
      alert.className = `alert-banner ${isError ? 'error' : 'success'}`;
      alert.textContent = msg;
      alert.style.display = 'block';
    }

    // 3. Form Submit
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const btn = document.getElementById('btnSignIn');
      const btnText = document.getElementById('btnSignInText');

      btn.disabled = true;
      btnText.textContent = 'Verifying credentials...';

      try {
        const res = await VickyAuth.login(email, password, rememberMe);
        showAlert('Sign in successful! Redirecting to studio dashboard...', false);
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } catch (err) {
        showAlert(err.message || 'Login failed. Please check credentials.');
        btn.disabled = false;
        btnText.textContent = 'Sign In to Studio';
      }
    }

    // 4. Google Sign In
    async function handleGoogleSignIn() {
      try {
        await VickyAuth.signInWithGoogle();
      } catch (err) {
        showAlert(err.message || 'Google OAuth failed.');
      }
    }

    // 5. Forgot Password Flow
    function openForgotModal(e) {
      if (e) e.preventDefault();
      document.getElementById('forgotModal').style.display = 'flex';
      const curEmail = document.getElementById('loginEmail').value;
      if (curEmail) document.getElementById('forgotEmail').value = curEmail;
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').style.display = 'none';
    }

    async function submitForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const alert = document.getElementById('forgotAlert');
      if (!email || !email.includes('@')) {
        alert.className = 'alert-banner error';
        alert.textContent = 'Please enter a valid email address.';
        alert.style.display = 'block';
        return;
      }

      try {
        await VickyAuth.resetPassword(email);
        alert.className = 'alert-banner success';
        alert.textContent = `Password reset link dispatched to ${email}.`;
        alert.style.display = 'block';
        setTimeout(() => closeForgotModal(), 2000);
      } catch (err) {
        alert.className = 'alert-banner error';
        alert.textContent = err.message || 'Failed to dispatch reset request.';
        alert.style.display = 'block';
      }
    }

    // 6. Pre-fill remembered email if present
    document.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('vicky_remember_email');
      if (savedEmail) {
        document.getElementById('loginEmail').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
      }
    });

    // 7. Cinematic Background Canvas Animation
    (function initCinematicCanvas() {
      const canvas = document.getElementById('cinematicCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;
      let particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.speedY = (Math.random() - 0.5) * 0.4;
          this.opacity = Math.random() * 0.6 + 0.1;
          this.color = Math.random() > 0.5 ? '#8b5cf6' : '#06b6d4';
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.opacity;
          ctx.fill();
        }
      }

      for (let i = 0; i < 70; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
